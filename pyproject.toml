[project]
name = "gate-cli"
version = "0.1.0"
description = "Unified CLI for the Maelstrom Gate ecosystem — operator's Swiss army knife"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "maelstrom-gate",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gate = "gate_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

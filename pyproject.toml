[project]
name = "gate-cli"
version = "0.1.0"
description = "Unified CLI for the Maelstrom Gate ecosystem — operator's Swiss army knife"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "maelstrom-gate",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gate = "gate_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Register custom markers so pytest doesn't warn about unknown names.
markers = [
    "integration: requires a live gate-server at localhost:8900 (deselected by default)",
]
# Default test run excludes integration tests — they need live infrastructure.
# Run them explicitly with: pytest -m integration
addopts = "-m 'not integration'"
